name: GitHub Pages

# Publish the coverage report only after CI has passed on master.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  APP_ENV: test
  DATABASE_URL: 'postgresql://app:password@127.0.0.1:5432/app?serverVersion=15&charset=utf8'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit that CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, gd, pdo_pgsql
          coverage: pcov

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          require-lock-file: true

      - name: Run PHPUnit with coverage
        run: php vendor/bin/phpunit --coverage-html coverage --coverage-clover clover.xml

      - name: Generate pages site
        run: |
          mkdir -p _site
          cp -r coverage _site/coverage
          cp .github/pages/index.html _site/index.html
          cp .github/pages/style.css _site/style.css

          # Extract coverage percentage from clover.xml
          COVERAGE=$(php -r '
            $xml = simplexml_load_file("clover.xml");
            $metrics = $xml->project->metrics;
            $total = (int)$metrics["elements"];
            $covered = (int)$metrics["coveredelements"];
            echo $total > 0 ? round($covered / $total * 100, 1) : "N/A";
          ')

          # Replace placeholder with actual coverage value
          sed -i "s/COVERAGE_PLACEHOLDER/${COVERAGE}/" _site/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
